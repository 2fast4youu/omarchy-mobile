# SPDX-License-Identifier: MIT
# Guarded SDM845 descriptor for Google Pixel 3 (blueline).
#
# Like its Pixel 4 family, blueline boots through Qualcomm ABOOT with Android
# boot image header v2: boot and dtbo per slot, no vendor_boot, no init_boot
# and no vendor_kernel_boot (the Pixel 4 notes verified this layout with
# fastboot on real hardware; gate M1.0 below re-checks it on this phone
# before anything is written). ABOOT matches appended device trees by
# qcom,msm-id and qcom,board-id, and upstream's sdm845-google-blueline.dts
# carries both (msm-id SDM845 0x20001, board-id 0x00021505), so the tree it
# boots is upstream's, untouched. The Tensor android-v4 packer, installer,
# flash and push paths refuse BOOT_METHOD=android-v2 before touching a
# phone, as they refuse the Pixel 4's ram-only probe.
#
# Once a builder knows this method, our writes are boot_b, dtbo_b and
# userdata, and the storage guard's allowlist is exactly those three. The
# slot flags of this generation live in the GPT partition attributes
# (CONTRIBUTING 3.1: no device has an entry yet), so BRINGUP-M1.md captures
# every LUN's GPT, headers and CRCs before its first write and records
# them again after it. Slot A's stock Android stays the way back.

CODENAME=blueline
NAME="Google Pixel 3"
SOC=sdm845
# The first string of upstream's board DTS root compatible. It is also the
# firmware lookup key (the Wi-Fi node asks for calibration variant
# Google_blueline) and the initramfs's board check.
COMPATIBLE="google,blueline"
# This phone's userspace support package (storage guard, USB gadget
# address, power-key policy, boot-success marker).
PACKAGE=omamobile-device-blueline
BOOT_METHOD=android-v2
# Empty while no builder knows the method: generic image, flash, push and
# installer paths refuse this descriptor before phone access. Candidates
# for when they learn it: BOOT_IMAGES="boot dtbo",
# UFS_RW="boot_b dtbo_b userdata".
BOOT_IMAGES=""
UFS_RW=""
# Panel size in pixels, portrait, for the early splash: upstream's
# framebuffer0 sets width 1080, height 2160 (simple-framebuffer, a8r8g8b8,
# the splash region ABOOT leaves at 0x9d400000).
PANEL_SIZE=1080x2160
