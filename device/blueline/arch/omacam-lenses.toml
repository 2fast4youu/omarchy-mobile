# CAMSS and the software ISP share a small contiguous memory pool. Use a
# preview mode that fits the pool while keeping a larger mode for stills.
device = "blueline"

[[lens]]
role = "main"
name = "Main"
id = "/base/soc@0/cci@ac4a000/i2c-bus@0/camera@1a"
zoom = 1.0
preview = [1280, 720]
still = [1920, 1080]

[[lens]]
role = "front"
name = "Front"
id = "/base/soc@0/cci@ac4a000/i2c-bus@1/camera@10"
zoom = 1.0
preview = [960, 540]
still = [1280, 720]
mirror = true
