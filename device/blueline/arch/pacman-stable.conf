[options]
HoldPkg = pacman glibc
Architecture = aarch64
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
DisableSandboxFilesystem
DisableSandboxSyscalls
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Required
# These packages need testing with the Pixel 3 kernel, Adreno and CAMSS.
IgnorePkg = linux-aarch64 linux-omamobile mkinitcpio omamobile-boot-update hyprland hyprpm aquamarine mesa vulkan-mesa-implicit-layers vulkan-freedreno libcamera libcamera-ipa libcamera-tools gst-plugin-libcamera python-libcamera

[omamobile]
SigLevel = Required DatabaseRequired
Include = /etc/pacman.d/omamobile-mirrorlist

[omarchy]
Server = https://pkgs.omarchy.org/stable/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
