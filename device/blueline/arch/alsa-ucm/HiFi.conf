SectionVerb {
    EnableSequence [
        cset "name='Left Digital PCM Volume' 656"
        cset "name='Right Digital PCM Volume' 656"
        cset "name='Left Analog PCM Volume' 8"
        cset "name='Right Analog PCM Volume' 8"
        cset "name='QUAT_TDM_RX_0 Audio Mixer MultiMedia1' on"
        cset "name='DMIC MUX0' DMIC0"
        cset "name='ADC MUX0' DMIC"
        cset "name='CDC_IF TX0 MUX' DEC0"
        cset "name='AIF1_CAP Mixer SLIM TX0' on"
        cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' on"
    ]

    DisableSequence [
        cset "name='QUAT_TDM_RX_0 Audio Mixer MultiMedia1' off"
        cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' off"
        cset "name='AIF1_CAP Mixer SLIM TX0' off"
        cset "name='CDC_IF TX0 MUX' ZERO"
        cset "name='DMIC MUX0' ZERO"
    ]

    Value {
        TQ "HiFi"
    }
}

SectionDevice."Speaker" {
    Comment "Internal speakers"

    Value {
        PlaybackPriority 200
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
    }
}

SectionDevice."Mic" {
    Comment "Internal digital microphone"

    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},1"
        CaptureChannels 1
    }
}
