Version = 1;
Make: "Google";
Model: "Pixel 3";

// Pixel 3 (blueline), sdm845-camss.
// Rueckkamera: IMX363 auf cci_i2c0 (csiphy0), Front: zwei IMX355 auf
// cci_i2c1 (csiphy1/csiphy2). Entity-Namen stammen aus media-ctl -p.


Rear: {
  SensorDriver: "imx363";
  BridgeDriver: "qcom-camss";
  Modes: (
  {
    Width: 4032;
    Height: 3024;
    Rate: 30;
    Rotate: 90;
    Format: "RGGB10P";
    Pipeline: (
      {Type: "Link", From: "msm_csiphy0", FromPad: 1, To: "msm_csid0", ToPad: 0},
      {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
      {Type: "Mode", Entity: "imx363"},
      {Type: "Mode", Entity: "msm_csiphy0"},
      {Type: "Mode", Entity: "msm_csid0"},
      {Type: "Mode", Entity: "msm_vfe0_rdi0"}
    );
  }
  );
};

Front: {
  SensorDriver: "imx355";
  BridgeDriver: "qcom-camss";
  Modes: (
  {
    Width: 3264;
    Height: 2448;
    Rate: 30;
    Rotate: 270;
    Mirror: True;
    Format: "RGGB10P";
    Pipeline: (
      {Type: "Link", From: "msm_csiphy1", FromPad: 1, To: "msm_csid0", ToPad: 0},
      {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
      {Type: "Mode", Entity: "imx355"},
      {Type: "Mode", Entity: "msm_csiphy1"},
      {Type: "Mode", Entity: "msm_csid0"},
      {Type: "Mode", Entity: "msm_vfe0_rdi0"}
    );
  }
  );
};

FrontAux: {
  SensorDriver: "imx355";
  BridgeDriver: "qcom-camss";
  Modes: (
  {
    Width: 3264;
    Height: 2448;
    Rate: 30;
    Rotate: 270;
    Mirror: True;
    Format: "RGGB10P";
    Pipeline: (
      {Type: "Link", From: "msm_csiphy2", FromPad: 1, To: "msm_csid0", ToPad: 0},
      {Type: "Link", From: "msm_csid0", FromPad: 1, To: "msm_vfe0_rdi0", ToPad: 0},
      {Type: "Mode", Entity: "imx355"},
      {Type: "Mode", Entity: "msm_csiphy2"},
      {Type: "Mode", Entity: "msm_csid0"},
      {Type: "Mode", Entity: "msm_vfe0_rdi0"}
    );
  }
  );
};
