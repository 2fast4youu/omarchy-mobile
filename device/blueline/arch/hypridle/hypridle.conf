# Pixel 3: nach 29 Minuten ohne Beruehrung dimmen, nach 30 Minuten
# Bildschirm aus (vorher 30 s / 60 s). Die Ein/Aus-Taste schaltet sofort ab.
listener {
    timeout = 1740
    on-timeout = /usr/local/libexec/blueline-idle dim
    on-resume = /usr/local/libexec/blueline-idle undim
}

listener {
    timeout = 1800
    on-timeout = /usr/local/libexec/blueline-idle display-off
    on-resume = /usr/local/libexec/blueline-idle display-on
}
