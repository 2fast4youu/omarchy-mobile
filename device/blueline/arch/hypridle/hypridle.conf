# Telefon-Idle: Helligkeit runter, dann Bildschirm aus, dann Suspend.
# KEIN Lock: ohne Passwort blockiert der Omarchy-Lock die Shell
# (quickshell-Zombie mit haengenden Layern, am Geraet belegt 2026-11-09).
# Helligkeit ueber brightnessctl (findet das Backlight-Geraet selbst,
# unabhaengig vom Pfad /sys/class/backlight/<name>/brightness).
listener {
    timeout = 30
    on-timeout = brightnessctl -q set 10%
    on-resume = brightnessctl -q set 40%
}

listener {
    timeout = 60
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend nach 5 Minuten. Vorher wird ein RTC-Alarm gesetzt, damit das
# Geraet auch ohne Tastendruck zurueckkommt (im s2idle ist der USB-Port
# abgeschaltet; ohne Alarm ist es nicht erreichbar - am Geraet belegt).
# Der fsnotify/SRCU-Deadlock ist im Kernel behoben, s2idle laeuft
# (suspend_stats success=3, fail=0).
listener {
    timeout = 300
    on-timeout = sh -c "echo 0 > /sys/class/rtc/rtc0/wakealarm; echo +3600 > /sys/class/rtc/rtc0/wakealarm; echo mem > /sys/power/state"
}
