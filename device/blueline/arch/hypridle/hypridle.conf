# Telefon-Idle: Helligkeit runter, dann Bildschirm aus (Akku sparen).
# KEIN Lock: ohne Passwort blockiert der Omarchy-Lock die Shell
# (quickshell-Zombie mit haengenden Layern, am Geraet belegt 2026-11-09).
# Suspend bleibt aus, solange der fsnotify-Fix nicht im Boot ist.
listener {
    timeout = 30
    on-timeout = sh -c "echo 26 > /sys/class/backlight/ae94000.dsi.0/brightness"
    on-resume = sh -c "echo 102 > /sys/class/backlight/ae94000.dsi.0/brightness"
}

listener {
    timeout = 60
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
